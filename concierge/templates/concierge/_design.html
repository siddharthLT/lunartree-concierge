<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FFFFFF">
<style>
[hidden]{display:none!important}
:root{--font-sans-fallback:1}
:root {
  color-scheme: light;

  /* colour - brand */
  --teal-deep: #035F62;          /* actions, links, selected state, small text */
  --teal-deep-press: #024C4F;
  --teal: #078E93;               /* marks, focus, progress, icons */
  --teal-300: #67C8CC;
  --teal-200: #A9EBEE;
  --teal-50: #F0F9F9;            /* tinted surfaces */
  --orange: #DC5800;             /* meaningful highlights; marks only */

  /* colour - neutrals */
  --canvas: #FFFFFF;
  --surface-2: #F2F2F2;
  --line: #D8DDDE;               /* hairlines, card edges */
  --ink: #292D2E;                /* 14:1 on white */
  --ink-2: #5D6668;              /* 5.9:1 - secondary text */
  --ink-3: #9FA7A8;              /* non-text: dots, disabled marks */
  --ink-ctl: #8C9597;            /* 3:1 - input boundaries */
  --on-fill: #FFFFFF;
  --scrim: rgba(41, 45, 46, 0.42);
  --focus: #078E93;

  /* type */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-display: 24px;  --lh-display: 30px;   /* onboarding questions */
  --fs-h1: 26px;       --lh-h1: 32px;        /* page titles */
  --fs-h2: 19px;       --lh-h2: 26px;        /* section titles */
  --fs-h3: 17px;       --lh-h3: 24px;        /* card titles */
  --fs-body: 16px;     --lh-body: 24px;
  --fs-sm: 15px;       --lh-sm: 22px;
  --fs-meta: 14px;     --lh-meta: 20px;
  --fs-label: 13px;    --lh-label: 18px;
  --fs-micro: 12px;    --lh-micro: 16px;     /* eyebrows, tags - never prose */

  /* space */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-7: 28px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
  --gutter: 16px;

  /* shape */
  --r-xs: 6px;    /* tags */
  --r-sm: 8px;    /* controls, chips */
  --r-md: 12px;   /* cards, lists */
  --r-lg: 16px;   /* sheets, player */
  --r-pill: 999px;
  --control: 44px;
  --control-sm: 36px;

  /* elevation: teal-tinted, three rungs */
  --sh-1: 0 1px 2px rgba(3, 95, 98, 0.06);
  --sh-2: 0 8px 24px -14px rgba(3, 95, 98, 0.28);
  --sh-3: 0 22px 52px -22px rgba(3, 95, 98, 0.38);

  /* motion */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --d-1: 120ms; --d-2: 200ms; --d-3: 320ms;

  /* chrome */
  --appbar-h: 56px;
  --tabbar-h: 64px;
  --side-w: 256px;
}

@media (min-width: 900px) {
  :root {
    --fs-display: 28px; --lh-display: 34px;
    --fs-h1: 30px;      --lh-h1: 36px;
    --fs-h2: 20px;      --lh-h2: 28px;
    --gutter: 40px;
  }
}

/* --------------------------------------------------------------- base -- */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--canvas);
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: not-allowed; }
a { color: var(--teal-deep); text-underline-offset: 3px; }
img { max-width: 100%; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--teal-200); color: var(--ink); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }

.ico { display: block; flex: none; }
.ico-14 { stroke-width: 2; }
.ico-16 { stroke-width: 1.9; }
.ico-18 { stroke-width: 1.8; }
.ico-20 { stroke-width: 1.7; }
.ico-22 { stroke-width: 1.6; }
.ico-24 { stroke-width: 1.55; }
.ico-28 { stroke-width: 1.45; }
.ico-32 { stroke-width: 1.35; }

/* --------------------------------------------------------------- type -- */

.eyebrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal-deep);
}
.eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex: none;
}
.eyebrow--plain::before { display: none; }
.eyebrow--muted { color: var(--ink-2); }
.eyebrow--muted::before { background: var(--ink-3); }

.t-display {
  font-size: var(--fs-display); line-height: var(--lh-display);
  font-weight: 600; letter-spacing: -0.02em; color: var(--ink);
}
.t-display .hint { color: var(--ink-2); font-weight: 500; }
.t-h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: 600; letter-spacing: -0.022em; }
.t-h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: 600; letter-spacing: -0.012em; }
.t-h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 600; letter-spacing: -0.008em; }
.t-body { font-size: var(--fs-body); line-height: var(--lh-body); }
.t-sm { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.t-meta { font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); }
.t-label { font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 500; }
.t-muted { color: var(--ink-2); }
.clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------ buttons -- */

.btn {
  --btn-bg: var(--canvas); --btn-fg: var(--ink); --btn-bd: var(--line);
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: var(--control); padding: 0 18px; border-radius: var(--r-sm);
  background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--btn-bd);
  font-size: var(--fs-sm); line-height: 1; font-weight: 600; letter-spacing: -0.005em;
  white-space: nowrap; user-select: none; -webkit-tap-highlight-color: transparent; text-decoration: none;
  transition: background-color var(--d-1) var(--ease), border-color var(--d-1) var(--ease),
    color var(--d-1) var(--ease), box-shadow var(--d-1) var(--ease), transform var(--d-1) var(--ease);
}
.btn:hover:not(:disabled) { --btn-bd: var(--ink-ctl); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; }
.btn--primary { --btn-bg: var(--teal-deep); --btn-fg: var(--on-fill); --btn-bd: var(--teal-deep); }
.btn--primary:hover:not(:disabled) { --btn-bg: var(--teal-deep-press); --btn-bd: var(--teal-deep-press); }
.btn--ghost { --btn-bg: transparent; --btn-bd: transparent; --btn-fg: var(--teal-deep); padding: 0 12px; }
.btn--ghost:hover:not(:disabled) { --btn-bg: var(--teal-50); --btn-bd: transparent; }
.btn--quiet { --btn-bg: transparent; --btn-bd: transparent; --btn-fg: var(--ink-2); padding: 0 12px; }
.btn--quiet:hover:not(:disabled) { --btn-bg: var(--surface-2); --btn-bd: transparent; --btn-fg: var(--ink); }
.btn--sm { min-height: var(--control-sm); padding: 0 14px; font-size: var(--fs-label); border-radius: var(--r-sm); }
.btn--block { width: 100%; }
.btn--done { --btn-bg: var(--teal-50); --btn-fg: var(--teal-deep); --btn-bd: var(--teal-200); }
.btn .count { font-family: var(--font-mono); font-weight: 500; font-size: var(--fs-label); opacity: 0.9; margin-left: -2px; }
.btn[data-busy="true"] { color: transparent; pointer-events: none; }
.btn[data-busy="true"] .spinner { position: absolute; inset: 0; margin: auto; color: var(--btn-fg); }

.icon-btn {
  display: inline-grid; place-items: center; width: var(--control); height: var(--control);
  border-radius: var(--r-sm); color: var(--ink-2); flex: none;
  transition: background-color var(--d-1) var(--ease), color var(--d-1) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn--sm { width: var(--control-sm); height: var(--control-sm); }

.link-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
  color: var(--teal-deep); font-weight: 500; font-size: var(--fs-meta);
  text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--teal-deep) 35%, transparent);
  text-underline-offset: 3px;
}
.link-btn:hover { text-decoration-color: currentColor; }

/* ------------------------------------------------------------ spinner -- */

.spinner {
  width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block;
  border: 2px solid color-mix(in srgb, currentColor 22%, transparent);
  border-top-color: currentColor; animation: spin 0.8s linear infinite;
}
.spinner--sm { width: 14px; height: 14px; border-width: 1.75px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex: none; animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(0.7); opacity: .65 } 50% { transform: scale(1.15); opacity: 1 } }

/* ------------------------------------------------------------- fields -- */

.field { position: relative; display: flex; align-items: center; }
.field__input {
  width: 100%; min-height: 48px; padding: 0 44px 0 44px;
  border: 1px solid var(--ink-ctl); border-radius: var(--r-sm); background: var(--canvas);
  font-size: var(--fs-body); color: var(--ink);
  transition: border-color var(--d-1) var(--ease), box-shadow var(--d-1) var(--ease);
  -webkit-appearance: none; appearance: none;
}
.field__input::placeholder, .textarea::placeholder { color: var(--ink-2); opacity: 1; }
.field__input:hover, .textarea:hover { border-color: var(--ink-2); }
.field__input:focus, .textarea:focus {
  border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 22%, transparent); outline: none;
}
.field__input--plain { padding-left: 14px; }
.field__input[data-empty="true"] { padding-right: 14px; }
.field__lead { position: absolute; left: 14px; color: var(--ink-2); pointer-events: none; }
.field__trail { position: absolute; right: 4px; display: flex; align-items: center; gap: 4px; }
.field__trail .icon-btn { width: 40px; height: 40px; }
.field-label { display: block; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 500; color: var(--ink); margin-bottom: var(--s-2); }
.field-help { font-size: var(--fs-label); line-height: var(--lh-label); color: var(--ink-2); margin-top: var(--s-2); }
.field-error { font-size: var(--fs-label); line-height: var(--lh-label); color: #A23B00; margin-top: var(--s-2); display: flex; gap: 6px; align-items: center; }
.field__input[aria-invalid="true"] { border-color: #B84800; }
.textarea {
  width: 100%; min-height: 76px; max-height: 180px; padding: 12px 14px; resize: none;
  border: 1px solid var(--ink-ctl); border-radius: var(--r-sm); background: var(--canvas);
  font-size: var(--fs-body); line-height: var(--lh-body);
  transition: border-color var(--d-1) var(--ease), box-shadow var(--d-1) var(--ease);
}

/* -------------------------------------------------------------- chips -- */

.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
@media (max-width: 899px) {
.chips--scroll {
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  margin: -4px calc(var(--gutter) * -1); padding: 4px var(--gutter);
  scroll-padding: 0 var(--gutter);
  mask-image: linear-gradient(90deg, transparent 0, #000 var(--gutter), #000 calc(100% - var(--gutter)), transparent 100%);
}
.chips--scroll::-webkit-scrollbar { display: none; }
}
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2); flex: none;
  min-height: 40px; padding: 0 14px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--canvas); color: var(--ink);
  font-size: var(--fs-sm); font-weight: 500; line-height: 1;
  transition: background-color var(--d-1) var(--ease), border-color var(--d-1) var(--ease), color var(--d-1) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.chip .ico { color: var(--teal-deep); }
.chip:hover:not(:disabled) { border-color: var(--ink-ctl); }
.chip[aria-pressed="true"], .chip[aria-checked="true"], .chip[aria-selected="true"] {
  background: var(--teal-50); border-color: var(--teal); color: var(--teal-deep);
  box-shadow: inset 0 0 0 0.5px var(--teal);
}
.chip .chip__check { width: 16px; display: grid; place-items: center; margin-right: -4px; color: var(--teal-deep); }
.chip:disabled { color: var(--ink-3); background: var(--canvas); }
.chip:disabled .ico { color: var(--ink-3); }
.chip .chip__count { font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 400; color: var(--ink-2); }
.chip[aria-pressed="true"] .chip__count, .chip[aria-checked="true"] .chip__count { color: var(--teal-deep); }
.chip--sm { min-height: 32px; padding: 0 10px; font-size: var(--fs-label); gap: 6px; }
.chip--remove { padding-right: 6px; background: var(--teal-50); border-color: var(--teal-200); color: var(--teal-deep); }
.chip--remove .x { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; }
.chip--remove:hover .x { background: color-mix(in srgb, var(--teal) 14%, transparent); }

/* option row: single-choice list items (company, email) */
.options { display: grid; gap: var(--s-2); }
.option {
  display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 56px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--canvas); text-align: left;
  transition: border-color var(--d-1) var(--ease), background-color var(--d-1) var(--ease);
}
.option:hover { border-color: var(--ink-ctl); }
.option[aria-checked="true"] { border-color: var(--teal); background: var(--teal-50); }
.option__icon { width: 32px; height: 32px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--teal-50); color: var(--teal-deep); flex: none; }
.option--quiet .option__icon { background: var(--surface-2); color: var(--ink-2); }
.option__main { flex: 1; min-width: 0; font-weight: 500; }
.option__aside { color: var(--ink-2); font-size: var(--fs-meta); }
.option__chev { color: var(--ink-3); }

/* ---------------------------------------------------------- segmented -- */

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
  padding: 3px; border-radius: 10px; background: var(--surface-2);
}
.seg__item {
  min-height: 38px; padding: 0 12px; border-radius: 7px; color: var(--ink-2);
  font-size: var(--fs-sm); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  transition: background-color var(--d-1) var(--ease), color var(--d-1) var(--ease), box-shadow var(--d-1) var(--ease);
}
.seg__item:hover { color: var(--ink); }
.seg__item[aria-pressed="true"] { background: var(--canvas); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(41,45,46,.08), 0 0 0 1px rgba(41,45,46,.04); }
.seg__count { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--ink-2); font-weight: 400; }

/* day tabs: underline tabs carrying a date */
.daytabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s-2); }
.daytab {
  position: relative; display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: var(--s-2); row-gap: 2px;
  min-height: 56px; padding: 9px 4px 11px; color: var(--ink-2); font-weight: 500; text-align: left;
}
.daytab .d { grid-row: 1; grid-column: 1; color: var(--ink); font-weight: 600; font-size: var(--fs-sm); }
.daytab .n { grid-row: 1; grid-column: 2; justify-self: start; font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 1px 5px; line-height: 16px; }
.daytab .date { grid-row: 2; grid-column: 1 / -1; font-size: var(--fs-label); line-height: var(--lh-label); }
.daytab[aria-pressed="true"] .d, .daytab[aria-pressed="true"] .date { color: var(--teal-deep); }
.daytab[aria-pressed="true"] .n { background: var(--teal-50); color: var(--teal-deep); }
.daytab[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--teal-deep); border-radius: 2px;
}
@media (min-width: 640px) {
  .daytab { grid-template-columns: auto auto 1fr; min-height: 48px; padding: 10px 2px 12px; }
  .daytab .date { grid-row: 1; grid-column: 2; font-size: var(--fs-meta); }
  .daytab .n { grid-row: 1; grid-column: 3; }
}

/* --------------------------------------------------------------- tags -- */

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 8px;
  border-radius: var(--r-xs); background: var(--surface-2); color: var(--ink);
  font-size: var(--fs-micro); line-height: 1; font-weight: 500; white-space: nowrap;
}
.tag--type { background: var(--teal-50); color: var(--teal-deep); box-shadow: inset 0 0 0 1px var(--teal-200); }
.tag--mark::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.tag--outline { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.tag--match { background: var(--teal-50); color: var(--teal-deep); box-shadow: inset 0 0 0 1px var(--teal-200); gap: 4px; padding-left: 6px; }
.tag--match .ico { color: var(--teal); }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-label); color: var(--ink-2); }
.legend .tag { padding: 0 4px; min-height: 20px; }

.status {
  display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 9px 0 7px;
  border-radius: var(--r-pill); font-size: var(--fs-micro); line-height: 1; font-weight: 600;
  background: var(--teal-50); color: var(--teal-deep); white-space: nowrap;
}
.status .ico { color: var(--teal); }
.status--live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }

/* ------------------------------------------------------------- avatar -- */

.avatar {
  --av: 40px;
  width: var(--av); height: var(--av); border-radius: 50%; flex: none; position: relative;
  display: grid; place-items: center; background: var(--teal-50); color: var(--teal-deep);
  font-size: calc(var(--av) * 0.36); font-weight: 600; letter-spacing: 0.02em;
  box-shadow: inset 0 0 0 1px var(--teal-200);
}
.avatar--sm { --av: 28px; font-size: 11px; }
.avatar--lg { --av: 56px; }
.avatar--alt { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.avatar__mark {
  position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--orange); box-shadow: 0 0 0 2px var(--canvas);
}

/* ---------------------------------------------------- lists & surfaces -- */

.card { background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r-md); }
.list { background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 64px; padding: 12px 14px;
  text-align: left; background: var(--canvas); color: var(--ink);
  transition: background-color var(--d-1) var(--ease);
}
button.row:hover, a.row:hover { background: #FAFBFB; }
.row:focus-visible, .result:focus-visible { outline-offset: -2px; border-radius: 10px; }
.row__main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row__title { font-weight: 600; font-size: var(--fs-body); line-height: 22px; }
.row__sub { color: var(--ink-2); font-size: var(--fs-meta); line-height: var(--lh-meta); }
.row__chev { color: var(--ink-3); }
.tile-icon {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: var(--teal-50); color: var(--teal-deep); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal-200) 70%, transparent);
}

.banner {
  display: flex; gap: var(--s-3); align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--teal-50); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal-200) 80%, transparent);
  font-size: var(--fs-meta); line-height: var(--lh-meta);
}
.banner .ico { color: var(--teal-deep); margin-top: 1px; }
.banner b { font-weight: 600; color: var(--teal-deep); }

.divider-dots {
  height: 12px; margin: var(--s-8) 0; position: relative;
  background-image: radial-gradient(circle, var(--ink-3) 1px, transparent 1.2px);
  background-size: 12px 12px; background-position: center;
  mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
  opacity: 0.6;
}
.divider-dots::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
  border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px var(--canvas);
}

/* ---------------------------------------------------------- skeleton -- */

.skel { background: linear-gradient(90deg, var(--surface-2) 0%, #F8F8F8 40%, var(--surface-2) 80%); background-size: 200% 100%; animation: skel 1.4s ease-in-out infinite; border-radius: 6px; }
@keyframes skel { from { background-position: 100% 0 } to { background-position: -100% 0 } }

/* -------------------------------------------------------------- empty -- */

.empty { display: grid; justify-items: center; text-align: center; gap: var(--s-3); padding: var(--s-8) var(--s-4); }
.empty__art { color: var(--ink-3); }
.empty__title { font-weight: 600; font-size: var(--fs-body); }
.empty__body { color: var(--ink-2); font-size: var(--fs-meta); line-height: var(--lh-meta); max-width: 34ch; }
.empty .btn { margin-top: var(--s-2); }

/* ---------------------------------------------------------- progress -- */

.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 24px 1fr; gap: var(--s-3); align-items: start; padding: 10px 0; }
.step__mark { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink-3); position: relative; }
.step + .step .step__mark::before {
  content: ""; position: absolute; bottom: 100%; left: 50%; width: 1px; height: 22px; margin-left: -0.5px;
  background: var(--line); transform: translateY(-2px);
}
.step[data-state="done"] .step__mark { color: var(--teal-deep); }
.step[data-state="active"] .step__mark { color: var(--teal); }
.step__label { font-weight: 500; font-size: var(--fs-sm); line-height: 22px; color: var(--ink-2); transition: color var(--d-2) var(--ease); }
.step[data-state="active"] .step__label, .step[data-state="done"] .step__label { color: var(--ink); }
.step__detail { font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); margin-top: 1px; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: inherit; transition: width var(--d-3) var(--ease); }

/* -------------------------------------------------------------- sheet -- */

.scrim {
  position: fixed; inset: 0; background: var(--scrim); z-index: 80;
  animation: fade-in var(--d-2) var(--ease) both;
}
.sheet {
  position: fixed; z-index: 81; left: 0; right: 0; bottom: 0;
  max-height: calc(100% - 48px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  background: var(--canvas); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--sh-3);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: sheet-up var(--d-3) var(--ease-out) both;
}
.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet__head {
  display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-4) var(--s-4) var(--s-3);
  padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-2), env(safe-area-inset-right, 0px));
}
.sheet__title { flex: 1; min-width: 0; }
.sheet__body {
  overflow-y: auto; padding: 0 var(--s-4) var(--s-4); overscroll-behavior: contain;
  padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-4), env(safe-area-inset-right, 0px));
}
.sheet__foot {
  display: flex; gap: var(--s-2); padding: var(--s-3) var(--s-4) var(--s-4); border-top: 1px solid var(--line);
  padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-4), env(safe-area-inset-right, 0px));
}
.sheet__foot .btn { flex: 1; }
@media (min-width: 720px) {
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%; width: min(560px, calc(100vw - 48px));
    max-height: min(720px, calc(100vh - 64px)); border-radius: var(--r-lg); transform: translate(-50%, -50%);
    animation: dialog-in var(--d-3) var(--ease-out) both; padding-bottom: 0;
  }
  .sheet::before { display: none; }
  .sheet__head { padding: var(--s-5) var(--s-5) var(--s-3) var(--s-6); }
  .sheet__body { padding: 0 var(--s-6) var(--s-5); }
  .sheet__foot { padding: var(--s-4) var(--s-6); justify-content: flex-end; }
  .sheet__foot .btn { flex: none; min-width: 120px; }
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes dialog-in { from { transform: translate(-50%, calc(-50% + 12px)); opacity: 0 } to { transform: translate(-50%, -50%); opacity: 1 } }
@keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

.sheet-success { display: grid; justify-items: start; gap: var(--s-3); padding: var(--s-2) 0 var(--s-2); }
.sheet-success .ico { color: var(--teal-deep); }

.kv { display: grid; grid-template-columns: 96px 1fr; gap: var(--s-2) var(--s-3); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; }
.kv dd.tags { align-items: flex-start; align-self: start; }
.kv dt { padding-top: 2px; }

/* -------------------------------------------------------------- toast -- */

.toasts {
  position: fixed; z-index: 90; left: 0; right: 0; display: grid; justify-items: center; gap: var(--s-2);
  bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom, 0px)); pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: var(--s-3); max-width: 100%;
  min-height: 44px; padding: 6px 6px 6px 14px; border-radius: 10px; background: var(--ink); color: var(--on-fill);
  font-size: var(--fs-meta); line-height: var(--lh-meta); box-shadow: var(--sh-3); animation: rise var(--d-2) var(--ease-out) both;
}
.toast .ico { color: var(--teal-300); }
.toast button { min-height: 32px; padding: 0 10px; border-radius: 6px; color: var(--teal-200); font-weight: 600; }
.toast button:hover { background: rgba(255, 255, 255, 0.08); }
.toast-spacer { width: 8px; }

/* ===================================================== app chrome ===== */

.shell { min-height: 100%; }
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--appbar-h);
  display: flex; align-items: center; gap: var(--s-3); background: var(--canvas);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid transparent; transition: border-color var(--d-2) var(--ease);
}
.appbar[data-scrolled="true"] { border-bottom-color: var(--line); }
.brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); text-decoration: none; }
.brand__mark { width: 28px; height: 28px; flex: none; }
.brand__name { font-weight: 600; font-size: var(--fs-sm); letter-spacing: -0.01em; white-space: nowrap; }
.brand__name .sep { color: var(--ink-3); padding: 0 1px; }
@media (max-width: 379px) {
  .appbar { gap: var(--s-2); }
  .appbar .brand { gap: 8px; }
  .appbar .brand__mark { width: 24px !important; height: 24px !important; }
  .appbar .brand__name { font-size: 14px; }
  .appbar .desk-chip { font-size: 10px; letter-spacing: 0.06em; padding: 0 8px; }
  .appbar .desk-chip::before { display: none; }
  .seg__item { padding: 0 8px; }
  .seg__count { display: none; }
}
.desk-chip {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px;
  border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--ink-2);
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
}
.desk-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }

.page {
  padding-top: var(--s-5); padding-bottom: calc(var(--tabbar-h) + var(--s-12) + env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  max-width: 820px; animation: page-in var(--d-3) var(--ease-out) backwards;
}
@keyframes page-in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.page-head { display: grid; gap: var(--s-2); margin-bottom: var(--s-6); }
.page-head .eyebrow { margin-bottom: 2px; }
.page-head .t-meta { font-size: var(--fs-sm); line-height: var(--lh-sm); max-width: 52ch; }
.section { margin-top: var(--s-8); }
.section-head { display: grid; gap: 4px; margin-bottom: var(--s-4); }

.tabbar {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--canvas) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab {
  position: relative; display: grid; justify-items: center; align-content: center; gap: 4px; height: var(--tabbar-h);
  color: var(--ink-2); font-size: 11.5px; font-weight: 500; line-height: 1; -webkit-tap-highlight-color: transparent;
}
.tab[aria-current="page"] { color: var(--teal-deep); font-weight: 600; }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 50%; width: 24px; height: 2px; margin-left: -12px; border-radius: 0 0 2px 2px; background: var(--teal-deep);
}
.tab:disabled { opacity: 0.4; }

.sidenav { display: none; }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
  .appbar, .tabbar { display: none; }
  .toasts { bottom: 24px; }
  .sidenav {
    display: flex; flex-direction: column; gap: var(--s-6); position: sticky; top: 0; height: 100vh;
    padding: var(--s-6) var(--s-4) var(--s-5); border-right: 1px solid var(--line); background: var(--canvas);
    padding-left: max(var(--s-4), env(safe-area-inset-left, 0px));
  }
  .sidenav .brand { padding: 0 var(--s-2); }
  .sidenav__event { display: grid; gap: 4px; padding: var(--s-3) var(--s-3); border-radius: var(--r-md); background: var(--teal-50); }
  .sidenav__event .t-label { color: var(--ink); }
  .sidenav nav { display: grid; gap: 2px; }
  .navitem {
    display: flex; align-items: center; gap: var(--s-3); min-height: 42px; padding: 0 var(--s-3); border-radius: var(--r-sm);
    color: var(--ink-2); font-weight: 500; font-size: var(--fs-sm); width: 100%;
    transition: background-color var(--d-1) var(--ease), color var(--d-1) var(--ease);
  }
  .navitem:hover { background: var(--surface-2); color: var(--ink); }
  .navitem[aria-current="page"] { background: var(--teal-50); color: var(--teal-deep); font-weight: 600; }
  .navitem:disabled { opacity: 0.4; }
  .sidenav__foot { margin-top: auto; display: grid; gap: var(--s-2); padding: var(--s-3); border-top: 1px solid var(--line); }
  .who { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
  .page { padding-top: var(--s-10); padding-bottom: var(--s-12); margin-inline: auto; max-width: 800px; }
  .player { aspect-ratio: 16 / 8; }
}

/* ======================================================= onboarding ===== */

.ob { position: relative; min-height: 100vh; min-height: 100dvh; overflow-x: clip; background: var(--canvas); }
.ob-field {
  position: absolute; inset: 0 0 auto 0; height: 620px; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.75) 55%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.75) 55%, transparent 100%);
}
.ob-field canvas { width: 100%; height: 100%; display: block; }
.ob-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--canvas) 95%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent; transition: border-color var(--d-2) var(--ease);
}
.ob-bar[data-scrolled="true"] { border-bottom-color: var(--line); }
.ob-bar__inner {
  max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: var(--s-3); height: 60px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.ob-progress {
  max-width: 640px; margin: 0 auto; display: grid; gap: 8px; padding-bottom: 10px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.ob-progress__meta { display: flex; justify-content: space-between; font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-2); }
.ob-progress__meta b { color: var(--ink); font-weight: 600; }
.ob-segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.ob-segs i { height: 3px; border-radius: 3px; background: var(--line); transition: background-color var(--d-3) var(--ease); }
.ob-segs i[data-on="true"] { background: var(--teal); }
.ob-segs i[data-now="true"] { background: var(--teal-deep); }
.ob-main {
  position: relative; z-index: 1; max-width: 640px; margin: 0 auto; min-height: 60vh;
  padding: var(--s-6) max(var(--gutter), env(safe-area-inset-right, 0px)) calc(var(--s-12) + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px));
}
.ob-wordmark { height: 18px; width: auto; display: block; }

.qa { display: grid; gap: var(--s-2); padding: var(--s-3) 0; border-bottom: 1px solid var(--line); animation: rise var(--d-3) var(--ease-out) both; }
.qa__q { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); color: var(--ink-2); font-size: var(--fs-meta); line-height: var(--lh-meta); }
.qa__edit { color: var(--teal-deep); font-weight: 500; font-size: var(--fs-label); min-height: 32px; padding: 0 8px; margin: -6px -8px -6px 0; border-radius: 6px; }
.qa__edit:hover { background: var(--teal-50); }
.reply {
  justify-self: end; display: inline-flex; align-items: center; gap: var(--s-2); max-width: 88%;
  padding: 9px 14px; border-radius: 14px 14px 4px 14px; background: var(--teal-50); color: var(--teal-deep);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal-200) 80%, transparent);
  font-weight: 500; font-size: var(--fs-sm); line-height: var(--lh-sm);
}
.reply .ico { color: var(--teal-deep); }
.reply .reply__icons { display: inline-flex; gap: 2px; }
.reply--muted { background: var(--surface-2); color: var(--ink-2); box-shadow: none; }

.q { display: grid; gap: var(--s-5); padding-top: var(--s-6); animation: rise var(--d-3) var(--ease-out) both; }
.q__head { display: grid; gap: 4px; }
.q__title:focus, .xp-panel:focus, main:focus { outline: none; }
.q__title { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: 600; letter-spacing: -0.02em; }
.q__title .hint { display: block; color: var(--ink-2); font-weight: 500; }
.q__title .inline-hint { color: var(--ink-2); font-weight: 500; }
.wave { display: inline-block; vertical-align: -3px; margin: 0 4px 0 6px; color: var(--teal); transform-origin: 70% 80%; animation: wave 1.6s var(--ease) 0.3s 1 both; }
@keyframes wave { 0%, 100% { transform: rotate(0) } 15% { transform: rotate(14deg) } 30% { transform: rotate(-8deg) } 45% { transform: rotate(12deg) } 60% { transform: rotate(-4deg) } 75% { transform: rotate(6deg) } }
.q__actions { display: flex; gap: var(--s-2); align-items: center; }
.q__actions .btn--primary { flex: 1; }
.q__actions .btn--quiet { min-width: 88px; }
@media (min-width: 900px) {
  .q__actions .btn--primary { flex: none; min-width: 200px; }
  .ob-main { padding-top: var(--s-10); }
}

.results { margin-top: var(--s-3); }
.results__meta { font-size: var(--fs-label); color: var(--ink-2); margin-bottom: var(--s-2); }
.results .list { box-shadow: var(--sh-2); }
.result { min-height: 60px; }
.result[aria-selected="true"], .result:hover { background: var(--teal-50); }
.result mark { background: none; color: var(--teal-deep); font-weight: 700; }
.result .row__sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.grid-2 .chip { width: 100%; justify-content: flex-start; min-height: 48px; }
.grid-2 .chip .chip__check { margin-left: auto; }

.regionmap { position: relative; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--canvas); padding: var(--s-3) var(--s-3) var(--s-2); }
.regionmap svg { display: block; width: 100%; height: auto; }
.regionmap circle { transition: fill var(--d-2) var(--ease), r var(--d-2) var(--ease); }
.regionmap__legend { display: flex; justify-content: space-between; font-size: var(--fs-micro); color: var(--ink-2); padding: var(--s-2) 2px 0; }
.region-chip .code { font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-label); letter-spacing: 0.02em; min-width: 38px; }
.region-chip .name { color: var(--ink-2); font-weight: 400; }
.region-chip[aria-pressed="true"] .name { color: var(--teal-deep); }

.prep { display: grid; gap: var(--s-6); max-width: 460px; margin: 0 auto; padding-top: var(--s-6); }
.prep__art { height: 168px; border-radius: var(--r-lg); overflow: hidden; background: var(--canvas); border: 1px solid var(--line); position: relative; }
.prep__art canvas { width: 100%; height: 100%; display: block; }
.prep__head { display: grid; gap: var(--s-2); }

/* ============================================================ home ===== */

.event-line { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--fs-meta); color: var(--ink-2); font-weight: 500; }
.event-line::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 16%, transparent); }
.event-line b { color: var(--ink); font-weight: 600; }
.welcome { display: grid; gap: var(--s-2); margin: var(--s-4) 0 var(--s-8); }
.welcome .t-h1 { display: flex; align-items: center; flex-wrap: wrap; }

.request-row .row__title { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }

.player {
  position: relative; border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; background: var(--canvas);
  aspect-ratio: 16 / 10; max-width: 100%;
}
.player:fullscreen { border-radius: 0; border: 0; display: grid; place-items: center; }
.player canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.player__caption {
  position: absolute; left: 52%; right: 6%; top: 50%; transform: translateY(-60%);
  font-weight: 600; letter-spacing: -0.015em; color: var(--ink); font-size: clamp(14px, 3.6vw, 22px); line-height: 1.2;
  transition: opacity var(--d-3) var(--ease);
}
.player__caption em { font-style: normal; color: var(--teal-deep); }
.player__controls {
  position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: var(--s-2);
}
.pbtn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--ink) 82%, transparent); color: var(--on-fill);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background-color var(--d-1) var(--ease);
}
.pbtn:hover { background: var(--ink); }
.pchapters { display: flex; gap: 6px; flex: 1; align-items: center; padding: 0 var(--s-2); }
.pchapter { flex: 1; height: 28px; display: grid; align-items: center; max-width: 64px; }
.pchapter i { display: block; height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); overflow: hidden; }
